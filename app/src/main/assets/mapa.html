<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#0D1117; --s1:#161B22; --s2:#21262D; --tx:#E6EDF3; --mu:#8B949E; --ac:#2FD3A6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--tx); font-family:system-ui,Roboto,sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }

  .bar { padding:10px 12px 6px; background:var(--bg); position:relative; z-index:500; }
  .selects { display:flex; gap:8px; }
  .sel { flex:1; position:relative; min-width:0; }
  .sel span { position:absolute; left:12px; top:6px; font-size:10px; color:var(--mu); pointer-events:none; }
  .sel select { width:100%; appearance:none; -webkit-appearance:none; background:var(--s1); color:var(--tx);
                border:1px solid #30363D; border-radius:12px; padding:20px 28px 7px 12px; font-size:14px; font-weight:600;
                text-overflow:ellipsis; }
  .sel::after { content:""; position:absolute; right:13px; top:50%; width:7px; height:7px; margin-top:-6px;
                border-right:2px solid var(--ac); border-bottom:2px solid var(--ac); transform:rotate(45deg); pointer-events:none; }
  .row { display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:1px solid #30363D; background:var(--s1); color:var(--tx); border-radius:999px; padding:7px 13px; font-size:13px; }
  .chip.on { background:#1d3b33; color:var(--ac); border-color:var(--ac); font-weight:700; }
  .chip { display:flex; align-items:center; gap:7px; }
  .chip:not(.on) .sy { opacity:.45; }
  .sy { font-style:normal; display:inline-flex; align-items:center; font-size:14px; line-height:1; }
  .sy.grad { width:22px; height:9px; border-radius:5px; background:linear-gradient(90deg,#1f6feb,#2FD3A6,#F5C518,#E5484D); }
  .sy.dots { gap:2px; } .sy.dots b { width:7px; height:7px; border-radius:50%; display:block; }
  .sy.line { width:20px; height:4px; border-radius:2px; background:linear-gradient(90deg,#6E7681 0 33%,#F5C518 33% 50%,#2FD3A6 50%); }
  .sy.ring { width:10px; height:10px; border-radius:50%; border:2px solid #3DD68C; }

  #mapwrap { flex:1; position:relative; min-height:160px; }
  #map { position:absolute; inset:0; }
  #legend { position:absolute; left:8px; bottom:26px; z-index:450; background:rgba(13,17,23,.8); border-radius:10px;
            padding:6px 9px; font-size:10.5px; color:var(--tx); line-height:1.55; max-width:calc(100% - 24px); }
  #legend .row { display:grid; grid-template-columns:auto 1fr; column-gap:8px; align-items:baseline; }
  #legend .row > b { font-weight:500; }
  #legend .its { display:flex; flex-wrap:wrap; column-gap:9px; }
  #legend .it { white-space:nowrap; }   /* símbolo e palavra nunca se separam */
  #legend .dot { width:8px; height:8px; margin:0 3px 0 0; }
  #legend .ln { display:inline-block; width:14px; height:4px; border-radius:2px; vertical-align:middle; margin:0 3px 0 0; }
  #scale { position:absolute; right:10px; top:50%; transform:translateY(-50%); z-index:450; display:flex; gap:6px;
           background:rgba(13,17,23,.8); border-radius:10px; padding:8px 8px 8px 6px; }
  #scale .grad { width:10px; border-radius:5px; background:linear-gradient(to top,#1f6feb,#2FD3A6 45%,#F5C518 70%,#E5484D); }
  #scale .lab { display:flex; flex-direction:column; justify-content:space-between; font-size:10px; height:130px; }
  #scale .lab small { color:var(--mu); }

  /* Painel de baixo: parte do layout; aberto, cresce até o tamanho do conteúdo e o mapa encolhe */
  #sheet { flex:none; position:relative; z-index:600; background:var(--s1); margin-top:-18px;
           border-top-left-radius:20px; border-top-right-radius:20px; box-shadow:0 -6px 24px rgba(0,0,0,.45); }
  #handle { padding:10px 16px 12px; touch-action:none; }
  #sheet .stats { touch-action:none; }
  #grip { width:44px; height:5px; border-radius:3px; background:#3a424d; margin:0 auto 10px; }
  .peek { display:grid; grid-template-columns:0.9fr 0.8fr 1.5fr 0.9fr; gap:8px; }
  .peek div { min-width:0; }
  .peek b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .peek span { color:var(--mu); font-size:11px; }
  #more { max-height:0; overflow:hidden; transition:max-height .25s ease; padding:0 14px; }
  #sheet.open #more { max-height:58vh; overflow-y:auto; }
  #moreIn { padding-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .st { background:var(--s2); border-radius:12px; padding:8px 10px; }
  .st b { display:block; font-size:16px; white-space:nowrap; }
  .st span { color:var(--mu); font-size:11px; }
  h3 { font-size:14px; margin:14px 0 6px; }
  .reg { display:flex; align-items:center; gap:10px; background:var(--s2); border-radius:12px; padding:9px 11px; margin-bottom:6px; }
  .reg .n { width:24px; height:24px; border-radius:50%; background:var(--ac); color:#06231B; font-weight:800;
            display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .reg .t { flex:1; font-size:13px; }
  .reg .t small { color:var(--mu); display:block; font-size:11px; }
  .reg .v { font-weight:800; font-size:15px; }
  .empty { color:var(--mu); font-size:13px; padding:6px 0; }
  .legend { color:var(--mu); font-size:11px; margin-top:8px; line-height:1.6; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 3px 0 8px; vertical-align:middle; }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--s2); color:var(--tx); }
  .leaflet-popup-content { font-size:13px; line-height:1.4; margin:10px 12px; }
  .leaflet-container { background:#1b1f24; }
  .leaflet-control-attribution { font-size:9px; background:rgba(13,17,23,.55) !important; color:#8B949E; }
  .leaflet-control-attribution a { color:#8B949E; }
  .rgn { width:22px; height:22px; border-radius:50%; background:#2FD3A6; color:#06231B; font:800 12px/22px system-ui,sans-serif;
         text-align:center; border:2px solid #0D1117; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .rgn.sel { background:#fff; transform:scale(1.25); }
  .leaflet-tooltip.rgtip { background:#0D1117; color:#E6EDF3; border:1px solid #2FD3A6; border-radius:8px; font:600 12px system-ui,sans-serif; padding:5px 8px; }
  .leaflet-tooltip.rgtip:before { border-top-color:#2FD3A6; }
  .reg .t small.w { color:#8B949E; }
  /* Modo: Análise | Itinerário */
  .tabs { display:flex; background:var(--s1); border:1px solid #30363D; border-radius:12px; padding:3px; margin-bottom:8px; }
  .tabs button { flex:1; border:0; background:none; color:var(--mu); font:700 14px system-ui,sans-serif; padding:8px 0; border-radius:9px; }
  .tabs button.on { background:#1d3b33; color:var(--ac); }
  .daynav { display:flex; align-items:center; justify-content:space-between; background:var(--s1); border:1px solid #30363D;
            border-radius:12px; padding:4px; }
  .daynav button { border:0; background:none; color:var(--ac); font-size:24px; width:44px; height:38px; }
  .daynav button:disabled { color:#30363D; }
  .daynav b { font-size:15px; }
  body.iti .selects, body.iti #lay, body.iti #scale { display:none !important; }
  body:not(.iti) .daynav { display:none; }
  /* Linha do tempo do dia */
  .sum { display:grid; grid-template-columns:0.75fr 1.15fr 0.85fr 1.25fr; gap:6px; }
  .sum div { min-width:0; } .sum b { display:block; font-size:16px; white-space:nowrap; } .sum span { color:var(--mu); font-size:11px; }
  .tl { position:relative; margin:10px 0 0; }
  .trip { background:var(--s2); border-radius:14px; padding:10px 12px; margin-bottom:6px; }
  .trip.sel { outline:2px solid var(--ac); }
  .trip .hd { display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; }
  .trip .hd .n { width:22px; height:22px; border-radius:50%; background:var(--ac); color:#06231B; font-size:12px;
                 display:flex; align-items:center; justify-content:center; flex:none; }
  .trip .hd .cat { font-size:11px; font-weight:800; padding:2px 7px; border-radius:6px; background:#30363D; }
  .trip .hd .cat.black { background:#000; color:#fff; border:1px solid #555; }
  .trip .hd .v { margin-left:auto; }
  .trip .st2 { color:#E5484D; font-size:12px; font-weight:700; margin-top:4px; }
  .step { display:grid; grid-template-columns:44px 14px 1fr; gap:6px; font-size:12.5px; padding:3px 0; align-items:start; }
  .step .h { color:var(--mu); font-variant-numeric:tabular-nums; }
  .step .b { width:10px; height:10px; border-radius:50%; margin-top:3px; }
  .step small { color:var(--mu); display:block; }
  .gap { color:var(--mu); font-size:12px; padding:4px 0 8px 14px; border-left:2px dashed #30363D; margin:0 0 6px 10px; }
  #me { position:absolute; right:10px; bottom:30px; z-index:450; width:44px; height:44px; border-radius:50%; border:0;
        background:var(--s1); color:#4C9AFF; font-size:22px; box-shadow:0 2px 8px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="tabs" id="tabs"><button data-m="ana" class="on">Análise</button><button data-m="iti">Itinerário</button></div>
    <div class="daynav"><button id="dprev">‹</button><b id="dlabel">Hoje</b><button id="dnext">›</button></div>
    <div class="selects">
      <label class="sel"><span>Período</span><select id="per"></select></label>
      <label class="sel"><span>Dias</span><select id="dia"></select></label>
      <label class="sel"><span>Horário</span><select id="hor"></select></label>
    </div>
    <div class="row" id="lay"></div>
  </div>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="legend"></div>
    <button id="me" title="Onde estou">◎</button>
    <div id="scale"><div class="grad"></div><div class="lab"><b id="smax">–</b><small>R$/h<br>das ofertas</small><b id="smin">–</b></div></div>
  </div>
  <div id="sheet">
    <div id="handle"><div id="grip"></div><div class="peek" id="peek"></div></div>
    <div id="more"><div id="moreIn"></div></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
// ---------- dados (vêm do app) ----------
function raw(name){ try { return (window.Radar && Radar.file(name)) || ""; } catch(e){ return ""; } }
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const split = l => { const out=[]; let cur="", q=false;
    for (const ch of l){ if (ch === '"') q=!q; else if (ch === ';' && !q){ out.push(cur); cur=""; } else cur+=ch; }
    out.push(cur); return out; };
  const head = split(lines[0]);
  return lines.slice(1).map(l => { const v=split(l), o={}; head.forEach((h,i)=>o[h]=v[i]??""); return o; });
}
const num = s => { if (s===undefined||s===null||s==="") return null; const n=parseFloat(String(s).replace(",", ".")); return isNaN(n)?null:n; };
const when = s => s ? new Date(s.replace(" ","T")) : null;
const inSP = (la,lo) => la!=null && lo!=null && la>-24.3 && la<-23.1 && lo>-47.4 && lo<-46.0;
const brl = v => "R$ " + v.toFixed(2).replace(".", ",");

const offers = parseCsv(raw("ofertas.csv")).map(o => {
  let la=num(o.origem_lat), lo=num(o.origem_lng), src="embarque";
  if (!inSP(la,lo)) { la=num(o.motorista_lat); lo=num(o.motorista_lng); src="você"; }
  return { t:when(o.data_hora), price:num(o.valor), km:num(o.km_total), min:num(o.min_total), rskm:num(o.rs_km),
           rsh:num(o.rs_hora), v:o.veredito, cat:o.categoria, orig:o.origem, dest:o.destino, la, lo, src };
}).filter(o => o.t && inSP(o.la,o.lo));
const trips = parseCsv(raw("corridas.csv")).map(c => ({ id:c.id, t:when(c.aceite), price:num(c.valor), st:c.status,
  rsh:num(c.rs_hora_real), wait:num(c.min_espera_passageiro), toPick:num(c.min_ate_embarque),
  orig:c.origem, dest:c.destino })).filter(c => c.t);
const routes = {};
parseCsv(raw("rotas.csv")).forEach(p => { const la=num(p.lat), lo=num(p.lng); if (!inSP(la,lo)) return;
  (routes[p.id] = routes[p.id] || []).push([la,lo,p.fase]); });
const passes = parseCsv(raw("passagens_radar.csv")).map(p => ({ t:when(p.data_hora), via:p.via, lim:num(p.limite),
  kmh:num(p.velocidade_gps), res:p.resultado||"", la:num(p.lat), lo:num(p.lng) })).filter(p => p.t && inSP(p.la,p.lo));
const valetas = parseCsv(raw("valetas.csv")).map(v => ({ la:num(v.lat), lo:num(v.lng), n:num(v.vezes)||1, auto:v.origem==="auto" }))
  .filter(v => inSP(v.la,v.lo));
let spots = []; try { spots = JSON.parse(raw("pontos.json") || "[]"); } catch(e) {}
let events = [];
function loadEvents(){ try { events = (JSON.parse(raw("eventos_hoje.json") || "{}").eventos || []).filter(e => inSP(e.lat, e.lng)); } catch(e) { events = []; } }
loadEvents();
window.reloadEvents = () => { loadEvents(); render(); };

// ---------- filtros ----------
const st = { per:"tudo", dia:"todos", hor:"todos", lay:{calor:true, ofertas:true, percursos:true, radares:false, valetas:true, pontos:true, eventos:true} };
const PER = [["1","Hoje"],["7","7 dias"],["30","30 dias"],["tudo","Tudo"]];
const DIA = [["todos","Todos"],["util","Seg–Sex"],["fds","Sáb–Dom"],["1","Segunda"],["2","Terça"],["3","Quarta"],["4","Quinta"],["5","Sexta"],["6","Sábado"],["0","Domingo"]];
const HOR = [["todos","O dia todo"],["6-12","6h–12h"],["12-18","12h–18h"],["18-24","18h–0h"],["0-6","0h–6h"]];
// Cada pill leva o mesmo símbolo que aparece no mapa
const LAY = [
  ["calor", `<i class="sy grad"></i>Calor`],
  ["ofertas", `<i class="sy dots"><b style="background:#3DD68C"></b><b style="background:#F5C518"></b><b style="background:#E5484D"></b></i>Ofertas`],
  ["percursos", `<i class="sy line"></i>Percursos`],
  ["radares", `<i class="sy ring"></i>Radares`],
  ["valetas", `<i class="sy" style="color:#E8590C">▲</i>Valetas`],
  ["pontos", `<i class="sy" style="color:#9775FA">★</i>Pontos`],
  ["eventos", `<i class="sy">🎭</i>Eventos`]
];

function ok(d){
  if (!d) return false;
  if (st.per === "1") { const t0 = new Date(); t0.setHours(t0.getHours() < 6 ? -18 : 6, 0, 0, 0); if (d < t0) return false; }
  else if (st.per !== "tudo" && (Date.now() - d) / 864e5 > +st.per) return false;
  const wd = d.getDay();
  if (st.dia === "util" && (wd === 0 || wd === 6)) return false;
  if (st.dia === "fds" && !(wd === 0 || wd === 6)) return false;
  if (/^\d$/.test(st.dia) && wd !== +st.dia) return false;
  if (st.hor !== "todos") { const [a,b] = st.hor.split("-").map(Number); const h = d.getHours(); if (h < a || h >= b) return false; }
  return true;
}
function selects(id, list, key){
  const el = document.getElementById(id);
  list.forEach(([v,l]) => { const o=document.createElement("option"); o.value=v; o.textContent=l; el.appendChild(o); });
  el.value = st[key];
  el.onchange = () => { st[key] = el.value; selReg = -1; render(); };
}
function layers(){
  const el = document.getElementById("lay");
  LAY.forEach(([v,l]) => { const b=document.createElement("button"); b.className="chip"; b.innerHTML=l; b.dataset.v=v;
    b.onclick = () => { st.lay[v] = !st.lay[v]; paint(); render(); }; el.appendChild(b); });
}
function paint(){ document.querySelectorAll("#lay .chip").forEach(b => b.classList.toggle("on", !!st.lay[b.dataset.v])); }

// ---------- mapa ----------
const map = L.map("map", { zoomControl:false, attributionControl:false }).setView([-23.56, -46.65], 12);
L.control.attribution({ position:"topleft", prefix:false }).addTo(map);
// Fundo escuro da Esri (sem chave). Se falhar, cai para o mapa padrão do OpenStreetMap.
const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
const base = L.tileLayer(esri + "World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom:16, attribution:"© Esri, HERE, Garmin, © OpenStreetMap" }).addTo(map);
const labels = L.tileLayer(esri + "World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom:16 }).addTo(map);
let fails = 0, switched = false;
base.on("tileerror", () => { if (++fails > 4 && !switched) { switched = true; map.removeLayer(base); map.removeLayer(labels);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(map); } });

let group = L.layerGroup().addTo(map), heat = null;
const vcol = v => v==="BOM" ? "#3DD68C" : v==="RUIM" ? "#E5484D" : "#F5C518";
const phcol = { A_CAMINHO:"#6E7681", NO_EMBARQUE:"#F5C518", EM_VIAGEM:"#2FD3A6" };

let regs = [], selReg = -1;
const regLayer = L.layerGroup().addTo(map);
// Endereço da oferta (lido da tela da Uber): "Rua X, Bairro, São Paulo" -> rua e bairro
const STREET = /^(r\.|rua|av\.?|avenida|al\.?|alameda|pç\.?|praça|pça\.?|tv\.?|travessa|estr\.?|estrada|rod\.?|rodovia|viaduto|largo|lgo\.?)\s/i;
function fixOcr(t){ return t.replace(/S[äa]o\b/g,"São").replace(/^l(?=[a-zà-ú])/,"I").trim(); }
function place(addr){
  const parts = (addr||"").split(",").map(x => fixOcr(x)).filter(x => x.length >= 2 && !/^s[aã]o( paulo)?$/i.test(x) && !/^\d/.test(x));
  let rua = null, bairro = null;
  if (parts[0] && STREET.test(parts[0])) { rua = parts[0].replace(/^R\.\s/,"Rua ").replace(/^Av\.?\s/,"Av. "); bairro = parts[1] || null; }
  else if (parts[0] && parts[0].split(" ").length >= 2 && !/ de$| do$| da$/.test(parts[0])) rua = parts[0]; // lugar conhecido (shopping, museu)
  if (bairro && (bairro.length < 2 || / de$| do$| da$/.test(bairro) || /bernardo|santo andr|osasco|guarulhos|diadema/i.test(bairro))) bairro = null;
  if (rua && / de$| do$| da$/.test(rua)) rua = null; // cortado na tela
  return { rua, bairro };
}
function showRegion(i){ const c = regs[i]; if (!c) return; selReg = i; sheet(false); render();
  map.fitBounds(c.bounds, { paddingTopLeft:[40,70], paddingBottomRight:[110,60], maxZoom:16 }); }
function safe(f){ try { f(); } catch(e) { console.log("mapa: " + e.message); } }
function render(){
  if (window.__iti) { renderItin(); return; }
  group.clearLayers(); if (heat) { map.removeLayer(heat); heat = null; }
  const of = offers.filter(o => ok(o.t));
  const tr = trips.filter(c => ok(c.t));
  const ps = passes.filter(p => ok(p.t));

  // Calor + faixa de cores
  const rs = of.map(o => o.rsh || 0).filter(x => x > 0);
  document.getElementById("scale").style.display = st.lay.calor && rs.length ? "flex" : "none";
  if (rs.length) { document.getElementById("smax").textContent = "R$ " + Math.round(Math.max(...rs));
                   document.getElementById("smin").textContent = "R$ " + Math.round(Math.min(...rs)); }
  if (st.lay.ofertas) of.forEach(o => safe(() => L.circleMarker([o.la,o.lo], { radius:6, color:"#0D1117", weight:1, fillColor:vcol(o.v), fillOpacity:.95 })
    .bindPopup(`<b>${brl(o.price||0)}</b> · ${o.cat||""}<br>${(o.km||0).toFixed(1)} km · ${Math.round(o.min||0)} min<br>`+
      `${o.rskm!=null?brl(o.rskm)+"/km":""} · ${o.rsh!=null?brl(o.rsh)+"/h":""}<br><small>${o.t.toLocaleString("pt-BR")}<br>`+
      `${o.orig||""} → ${o.dest||""}<br>(posição: ${o.src})</small>`).addTo(group)));
  if (st.lay.percursos) tr.forEach(c => safe(() => { const pts = routes[c.id]; if (!pts || pts.length < 2) return;
    let seg = [pts[0]], ph = pts[0][2];
    const flush = () => { if (seg.length > 1) L.polyline(seg.map(p => [p[0],p[1]]), { color:phcol[ph]||"#888", weight:4, opacity:.85 })
      .bindPopup(`<b>${brl(c.price||0)}</b> · ${c.st}<br>${c.rsh!=null?brl(c.rsh)+"/h real":""}<br>`+
        `até embarque: ${c.toPick!=null?c.toPick.toFixed(0)+" min":"?"} · espera: ${c.wait!=null?c.wait.toFixed(0)+" min":"?"}<br>`+

  if (z.x && z.y && !fitted) { fit(); render(); } }).observe(document.getElementById("map")); } catch(e) {}
</script>
