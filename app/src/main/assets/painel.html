<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Radar Corridas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* Pensado para usar no carro: textos de leitura >= 15px, alvos de toque >= 48px, bastante respiro */
  :root { --bg:#0D1117; --s1:#161B22; --s2:#21262D; --s3:#2B323B; --line:#30363D; --tx:#E6EDF3; --mu:#9AA4AF;
          --ac:#2FD3A6; --good:#3DD68C; --mid:#F5C518; --bad:#FF6369; --blue:#4C9AFF; --purple:#9775FA; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--tx); font-family:system-ui,Roboto,sans-serif; font-size:16px; line-height:1.35; }
  body { padding:0 0 40px; }
  button { font-family:inherit; cursor:pointer; }
  header { position:sticky; top:0; z-index:500; background:var(--bg); padding:14px 16px 14px; display:flex; align-items:center; gap:14px; }
  header button.back { width:52px; height:52px; border-radius:14px; border:0; background:var(--s2); color:var(--tx); font-size:28px; flex:none; }
  header h1 { margin:0; font-size:23px; line-height:1.15; } header small { display:block; color:var(--mu); font-size:14px; font-weight:400; margin-top:3px; }
  main { padding:0 16px; }
  .card { background:var(--s1); border:1px solid var(--line); border-radius:18px; padding:18px 16px; margin-bottom:14px; }
  .muted { color:var(--mu); } .tiny { font-size:13px; } .sm { font-size:15px; }
  .seg { display:flex; background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:4px; margin-bottom:14px; gap:4px; }
  .seg button { flex:1; min-height:50px; border:0; background:none; color:var(--mu); font-weight:700; font-size:16px; border-radius:11px; padding:0 4px; }
  .seg button.on { background:#1d3b33; color:var(--ac); }
  .seg button i { font-style:normal; font-weight:500; opacity:.85; margin-left:5px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .kpi { background:var(--s1); border:1px solid var(--line); border-radius:16px; padding:16px 14px; min-width:0; }
  .kpi b { display:block; font-size:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:2px 0; } .kpi span { color:var(--mu); font-size:14px; }
  .kpi.big b { font-size:26px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:14px; font-weight:700; padding:5px 11px; border-radius:999px; background:var(--s3); white-space:nowrap; }
  .chip.good { color:var(--good); background:rgba(61,214,140,.14); } .chip.mid { color:var(--mid); background:rgba(245,197,24,.14); } .chip.bad { color:var(--bad); background:rgba(255,99,105,.14); }
  .chip.acc { color:var(--ac); background:rgba(47,211,166,.14); }
  .pillrow { display:flex; gap:10px; margin-bottom:12px; overflow-x:auto; }
  .pill { min-height:48px; border:1px solid var(--line); background:var(--s1); color:var(--tx); border-radius:999px; padding:0 22px; font-weight:700; font-size:16px; flex:none; }
  .pill.on { background:var(--tx); color:var(--bg); }
  /* Histórico */
  .weeknav { display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:700; font-size:18px; margin:0 0 12px; }
  .weeknav button { width:52px; height:52px; border-radius:14px; border:0; background:var(--s2); color:var(--ac); font-size:28px; flex:none; }
  .bars { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; height:104px; }
  .bars div { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; padding-top:4px; }
  .bars i { display:block; width:100%; max-width:32px; border-radius:7px 7px 3px 3px; background:var(--s3); min-height:4px; }
  .bars i.has { background:var(--ac); } .bars span { font-size:15px; color:var(--mu); }
  .bars div.sel span { color:var(--tx); font-weight:800; }
  .dayhd { display:flex; justify-content:space-between; color:var(--mu); font-size:15px; font-weight:700; letter-spacing:.03em; margin:22px 2px 10px; text-transform:uppercase; }
  .offer { background:var(--s1); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; }
  .offer.accepted { border:2px solid rgba(47,211,166,.65); }
  .offer .top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .offer .val { font-size:26px; font-weight:800; }
  .offer .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .offer .sub { color:var(--mu); font-size:15px; margin-top:4px; }
  .offer .sub b { color:var(--tx); font-weight:600; }
  .offer .mets { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .offer .mets div { background:var(--s2); border-radius:12px; padding:12px 6px; text-align:center; min-width:0; } .offer .mets b { display:block; font-size:19px; white-space:nowrap; } .offer .mets span { font-size:13px; color:var(--mu); }
  .offer .addr { font-size:15px; color:var(--mu); margin-top:14px; line-height:1.5; }
  .g { color:var(--good); } .m { color:var(--mid); } .r { color:var(--bad); }
  /* Melhores horários */
  .rank { display:flex; align-items:center; gap:14px; background:var(--s1); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:10px; }
  .rank .n { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; flex:none; }
  .rank .t { flex:1; } .rank .t b { font-size:19px; } .rank .t small { display:block; color:var(--mu); font-size:14px; margin-top:2px; }
  .rank .v { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; } .rank .v b { display:block; font-size:18px; }
  .hourbar { display:grid; grid-template-columns:repeat(12,1fr); gap:4px; align-items:end; height:90px; margin-top:12px; }
  .hourbar i { display:block; border-radius:4px 4px 2px 2px; min-height:3px; }
  .hourlab { display:grid; grid-template-columns:repeat(12,1fr); gap:4px; font-size:12px; color:var(--mu); text-align:center; margin-top:6px; }
  /* Jornada */
  .phase { margin:16px 0; } .phase .row1 { display:flex; align-items:center; gap:10px; font-size:16px; }
  .phase .row1 b { margin-left:auto; font-size:17px; font-variant-numeric:tabular-nums; } .phase .row1 em { font-style:normal; color:var(--mu); font-size:14px; width:44px; text-align:right; }
  .track { height:9px; border-radius:5px; background:var(--s3); margin-top:8px; overflow:hidden; } .track i { display:block; height:100%; border-radius:5px; }
  .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .stack { display:flex; height:10px; border-radius:5px; overflow:hidden; margin-top:12px; background:var(--s3); } .stack i { display:block; height:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:14px; color:var(--mu); margin-top:10px; } .legend span { white-space:nowrap; }
  /* Custos */
  .hero { background:linear-gradient(180deg,#14261F,#10181A); border:1px solid #1f4237; border-radius:20px; padding:20px 18px; margin-bottom:14px; }
  .hero .big { font-size:40px; font-weight:800; } .hero .big small { font-size:17px; color:var(--mu); font-weight:500; }
  .hero .tip { display:inline-block; margin-top:10px; background:rgba(47,211,166,.12); color:var(--ac); border:1px solid rgba(47,211,166,.35); border-radius:12px; padding:10px 14px; font-weight:700; font-size:16px; }
  .field { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .field:last-child { border-bottom:0; } .field label { font-size:17px; } .field label small { display:block; color:var(--mu); font-size:13px; margin-top:2px; }
  .field input { width:120px; height:52px; background:var(--s2); border:1px solid var(--line); color:var(--tx); border-radius:12px; padding:0 12px; font-size:18px; text-align:right; font-weight:700; flex:none; }
  .field input.txt { width:170px; text-align:left; font-weight:600; font-size:17px; }
  h2 { font-size:15px; letter-spacing:.04em; color:var(--mu); margin:26px 2px 12px; text-transform:uppercase; }
  /* Estilo do cartão */
  .preview { background:#000; border-radius:20px; border:4px solid var(--good); padding:14px 16px; margin-bottom:8px; }
  .preview .tl { display:flex; gap:8px 14px; color:var(--tx); font-weight:700; font-size:19px; margin-bottom:10px; flex-wrap:wrap; }
  .preview .tl span { color:var(--mu); font-weight:500; }
  .preview .ml { display:flex; gap:6px; }
  .preview .ml div span { color:var(--mu); font-size:14px; display:block; } .preview .ml div { flex:1; min-width:0; } .preview .ml div b { font-size:17px; display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .preview .ml div b i { width:4px; height:24px; border-radius:2px; display:block; flex:none; }
  .slots { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .slot { background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:10px 8px 10px 16px; font-size:16px; font-weight:600; position:relative; min-height:64px; display:flex; align-items:center; gap:8px; }
  .slot .lb { flex:1; min-width:0; } .slot .hd { color:var(--mu); font-size:18px; }
  .slot .no { position:absolute; left:6px; top:5px; font-size:12px; color:var(--mu); font-weight:500; }
  .slot .mv button { border:0; background:var(--s3); color:var(--tx); border-radius:12px; width:44px; height:44px; font-size:18px; padding:0; flex:none; }
  .slot.empty { border-style:dashed; color:var(--mu); font-size:26px; justify-content:center; padding-left:8px; }
  .tray { display:flex; flex-wrap:wrap; gap:10px; background:var(--s1); border:1px dashed var(--line); border-radius:16px; padding:12px; }
  .tray button { min-height:50px; border:1px solid var(--line); background:var(--s2); color:var(--tx); border-radius:12px; padding:0 16px; font-weight:600; font-size:16px; }
  .note { font-size:14px; color:var(--mu); margin:10px 2px 14px; line-height:1.5; }
  .btn { display:block; width:100%; min-height:56px; border:0; border-radius:16px; padding:14px; font-weight:800; font-size:17px; background:var(--ac); color:#06231B; margin-top:16px; }
  .btn.alt { background:var(--s2); color:var(--tx); }
  .mini { height:170px; border-radius:14px; overflow:hidden; margin-top:14px; background:#1b2129; }
  .daymap { height:240px; border-radius:14px; overflow:hidden; background:#1b2129; margin:12px 0 12px; }
  .leaflet-container { background:#1b2129; }
  .slot.drag-over { outline:3px solid var(--ac); }
  .slot[data-key], .tray button { touch-action:none; user-select:none; -webkit-user-select:none; }
  .dghost { position:fixed; z-index:999; pointer-events:none; opacity:.92; transform:scale(1.06); box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .slot.dragging, .tray button.dragging { opacity:.3; }
  .gx { background:var(--s1); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; }
  .gx.pend { border-color:rgba(245,197,24,.45); background:linear-gradient(180deg,#1e1c12,var(--s1)); }
  .gx .top { display:flex; justify-content:space-between; align-items:center; gap:10px; } .gx .v { font-size:28px; font-weight:800; white-space:nowrap; } .gx .top select { min-width:0; flex:0 1 auto; }
  .gx .sub { color:var(--mu); font-size:15px; margin-top:4px; }
  .gx select { height:44px; border-radius:12px; background:var(--s2); color:var(--tx); border:1px solid var(--line); font-size:15px; font-weight:700; padding:0 10px; }
  .gx .acts { display:flex; gap:10px; margin-top:14px; } .gx .acts button { flex:1; min-height:56px; border:0; border-radius:14px; font-weight:800; font-size:17px; }
  .gx .acts .yes { background:var(--ac); color:#06231B; } .gx .acts .no { background:var(--s2); color:var(--tx); }
  .grow { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); } .grow:last-child { border-bottom:0; }
  .grow .ic { width:44px; height:44px; border-radius:12px; background:var(--s2); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .grow .t { flex:1; min-width:0; } .grow .t b { display:block; font-size:16px; } .grow .t small { color:var(--mu); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .grow .val { font-weight:800; font-size:17px; white-space:nowrap; } .grow .x { width:44px; height:44px; border:0; border-radius:12px; background:none; color:var(--mu); font-size:20px; }
  .perm { background:linear-gradient(180deg,#132033,#111821); border:1px solid #23406a; border-radius:20px; padding:20px 18px; margin-bottom:14px; }
  .perm b { font-size:19px; display:block; margin-bottom:6px; } .perm p { margin:0; color:var(--mu); font-size:15px; line-height:1.5; }
  .empty { color:var(--mu); text-align:center; padding:30px 8px; font-size:16px; }
  /* ===== animações ===== */
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes growY { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  @keyframes growX { from { width:0; } }
  @keyframes dash { to { stroke-dashoffset:0; } }
  .anim { animation:rise .55s cubic-bezier(.2,.9,.3,1.1) both; }
  .bars i, .hourbar i { transform-origin:50% 100%; animation:growY .8s cubic-bezier(.2,.9,.3,1.2) both; }
  .track i, .stack i { animation:growX 1s cubic-bezier(.2,.9,.3,1) both; }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; animation:dash 2s cubic-bezier(.4,0,.2,1) forwards; }
  .replay { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:52px; margin-top:12px; border:0; border-radius:14px;
            background:rgba(47,211,166,.14); color:var(--ac); font-weight:800; font-size:16px; }
  @media (prefers-reduced-motion: reduce) { .anim, .bars i, .hourbar i, .track i, .stack i, .draw { animation:none !important; } }
</style>

<body>
<header><button class="back" onclick="goBack()">‹</button><h1 id="ttl">Radar</h1></header>
<main id="app"></main>
<script>
// ===== dados do app =====
function raw(n){ try { return (window.Radar && Radar.file(n)) || ""; } catch(e){ return ""; } }
function pget(k, d){ try { const v = window.Radar && Radar.pref && Radar.pref(k); return v === undefined || v === null || v === "" ? d : v; } catch(e){ return d; } }
function pset(k, v){ try { window.Radar && Radar.setPref && Radar.setPref(k, String(v)); } catch(e){} }
function goBack(){ try { if (window.Radar && Radar.close) Radar.close(); else history.back(); } catch(e){ history.back(); } }
function parseCsv(text){ const lines = text.split(/\r?\n/).filter(l => l.trim()); if (!lines.length) return [];
  const split = l => { const o=[]; let c="", q=false; for (const ch of l){ if (ch === '"') q=!q; else if (ch === ';' && !q){ o.push(c); c=""; } else c+=ch; } o.push(c); return o; };
  const h = split(lines[0]); return lines.slice(1).map(l => { const v=split(l), o={}; h.forEach((k,i)=>o[k]=v[i]??""); return o; }); }
const num = s => { if (s==null||s==="") return null; const n=parseFloat(String(s).replace(/[^\d,.-]/g,"").replace(/\./g, "").replace(",", ".")); return isNaN(n)?null:n; };
const num2 = s => { if (s==null||s==="") return null; const n=parseFloat(String(s).replace(",", ".")); return isNaN(n)?null:n; };
const when = s => s ? new Date(s.replace(" ","T")) : null;
const brl = (v, d=2) => "R$ " + (v||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const hm = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m/60); return h ? `${h}h${String(m%60).padStart(2,"0")}` : `${m} min`; };
const WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"], MO = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const shiftDay = d => { const x = new Date(d.getTime() - 6*3600e3); x.setHours(0,0,0,0); return x; };
const key = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();

// faixas boa/média/ruim de R$/km e R$/hora (as mesmas do app)
const KMB = +pget("bad_km", 1.70), KMG = +pget("good_km", 3.50), HB = +pget("bad_hora", 55), HG = +pget("good_hora", 75);
const cls = (v, b, g) => v == null ? "" : v >= g ? "g" : v <= b ? "r" : "m";

// ofertas (sem repetir a mesma oferta lida duas vezes) + quais viraram corrida
const offersAll = parseCsv(raw("ofertas.csv")).map(o => ({ t:when(o.data_hora), app:o.app, cat:o.categoria, price:num2(o.valor), km:num2(o.km_total),
  min:num2(o.min_total), mb:num2(o.min_busca), rskm:num2(o.rs_km), rsh:num2(o.rs_hora), nota:num2(o.nota), lucro:num2(o.lucro), v:o.veredito, orig:o.origem, dest:o.destino }))
  .filter(o => o.t && o.price);
const offers = []; offersAll.sort((a,b)=>a.t-b.t).forEach(o => { const p = offers[offers.length-1];
  if (p && Math.abs(o.t - p.t) < 45e3 && Math.abs(o.price - p.price) < 0.02) return; offers.push(o); });
const trips = parseCsv(raw("corridas.csv")).map(c => ({ id:c.id, km:(num2(c.km_ate_embarque)||0)+(num2(c.km_viagem)||0), acc:when(c.aceite), price:num2(c.valor), st:c.status||"", app:c.app,
  minPick:num2(c.min_ate_embarque), wait:num2(c.min_espera_passageiro), minTrip:num2(c.min_viagem), end:when(c.fim), arr:when(c.chegada_embarque) })).filter(c => c.acc);
offers.forEach(o => { o.trip = trips.find(c => c.acc >= o.t && c.acc - o.t < 120e3 && Math.abs((c.price||0) - o.price) < 0.05); o.accepted = !!o.trip; });
// percursos gravados (rotas.csv): por corrida e o trajeto livre
const ROUTES = {}, FREE = [];
parseCsv(raw("rotas.csv")).forEach(p => { const la = num2(p.lat), lo = num2(p.lng); if (la == null || lo == null) return;
  if (p.fase === "LIVRE") { const t = when(p.data_hora); if (t) FREE.push([la, lo, t]); return; }
  (ROUTES[p.id] = ROUTES[p.id] || []).push([la, lo, p.fase]); });
const PHC = { A_CAMINHO:"#8B949E", NO_EMBARQUE:"#F5C518", EM_VIAGEM:"#2FD3A6" };
function drawMini(el, ids, free){
  if (!window.L) { el.innerHTML = '<div class="empty" style="padding:50px 0">Mapa indisponível sem internet</div>'; return; }
  const m = L.map(el, { zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false, tap:false, touchZoom:false });
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom:16 }).addTo(m);
  const all = [];
  (free || []).forEach(seg => { if (seg.length > 1) { L.polyline(seg, { color:"#4C9AFF", weight:2.5, opacity:.7, dashArray:"5 5" }).addTo(m); all.push(...seg); } });
  ids.forEach(id => { const pts = ROUTES[id] || []; let seg = [], ph = null;
    const flush = () => { if (seg.length > 1) L.polyline(seg, { color:PHC[ph] || "#888", weight:4, className:"draw" }).addTo(m); };
    pts.forEach(p => { all.push([p[0],p[1]]); if (p[2] !== ph) { if (seg.length) seg.push([p[0],p[1]]); flush(); seg = [[p[0],p[1]]]; ph = p[2]; } else seg.push([p[0],p[1]]); }); flush();
    if (pts.length) { L.circleMarker([pts[0][0],pts[0][1]], { radius:5, color:"#fff", weight:2, fillColor:"#8B949E", fillOpacity:1 }).addTo(m);
      const z = pts[pts.length-1]; L.circleMarker([z[0],z[1]], { radius:5, color:"#fff", weight:2, fillColor:"#E5484D", fillOpacity:1 }).addTo(m); } });
  if (all.length > 1) m.fitBounds(L.latLngBounds(all), { padding:[14,14], maxZoom:16 }); else el.remove();
  // trajeto se desenhando: cada linha com comprimento normalizado (pathLength=1)
  el.querySelectorAll("path.draw").forEach((p, i) => { p.setAttribute("pathLength", "1"); p.style.animationDelay = (300 + i * 120) + "ms"; });
}
function initMaps(){ document.querySelectorAll("[data-mini]").forEach(el => drawMini(el, el.dataset.mini.split("|"), null));
  document.querySelectorAll("[data-day]").forEach(el => { const k = el.dataset.day;
    const ids = trips.filter(c => key(shiftDay(c.acc)) === k).map(c => c.id);
    const fp = FREE.filter(p => key(shiftDay(p[2])) === k).sort((a,b) => a[2]-b[2]); const segs = []; let cur = [];
    fp.forEach((p, i) => { if (i && p[2] - fp[i-1][2] > 180e3) { segs.push(cur); cur = []; } cur.push([p[0],p[1]]); }); segs.push(cur);

let jDay = 0;

const MES3 = {jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function sessionOf(k){
  for (const x of sessions) {
    const m = /(\d{1,2}) de (\w{3})\.?,?\s*(\d{1,2}):(\d{2})\s*[–-]\s*(?:(\d{1,2}) de (\w{3})\.?,?\s*)?(\d{1,2}):(\d{2})/.exec(x.periodo||""); if (!m || !(m[2].toLowerCase() in MES3)) continue;
    const y = (when(x.lido_em) || new Date()).getFullYear();
    const a = new Date(y, MES3[m[2].toLowerCase()], +m[1], +m[3], +m[4]);
    if (key(shiftDay(a)) !== k) continue;
    let mins = (+m[7]*60 + +m[8]) - (+m[3]*60 + +m[4]); if (mins < 0) mins += 1440;
    if (m[5] && m[6] && +m[5] !== +m[1]) mins = (+m[7]*60 + +m[8]) + 1440 - (+m[3]*60 + +m[4]);
    return { start:a, end:new Date(a.getTime() + mins*60e3), online:mins, valor:num(x.valor), concl:+x.concluidas||null, ofer:+x.oferecidas||null };
  }

const offerOfTrip = {}; offers.forEach(o => { if (o.trip) offerOfTrip[o.trip.id] = o; });
// Fases de uma corrida; quando o Radar não mediu as fases, divide o tempo total pela proporção da oferta (busca x viagem)
function tripPhases(c){
  const tot = c.end ? Math.max(0, (c.end - c.acc)/60e3) : 0, done = c.st.startsWith("concluída");
  let p = c.minPick, w = c.wait, r = c.minTrip;

  if (r == null) { const o = offerOfTrip[c.id]; const share = o && o.min ? Math.min(.6, (o.mb || 0) / o.min) : .25;
    p = p ?? tot*share; w = w ?? 0; r = Math.max(0, tot - p - w); }
  return { p: p || 0, w: w || 0, r: r || 0 };
}
function dayStats(k){

  let pick = 0, wait = 0, ride = 0; ts.forEach(c => { const f = tripPhases(c); pick += f.p; wait += f.w; ride += f.r; });
  const done = ts.filter(c => c.st.startsWith("concluída"));
  const times = os.map(o=>o.t).concat(ts.map(c=>c.acc), ts.map(c=>c.end).filter(Boolean));
  let t0 = times.length ? new Date(Math.min(...times)) : null, t1 = times.length ? new Date(Math.max(...times)) : null;
  let online = t0 ? (t1 - t0)/60e3 : 0, src = "estimado: da 1ª oferta ao fim da última corrida";
  const s = sessionOf(k); let extra = null;
  if (s) { online = s.online; t0 = s.start; t1 = s.end; src = "da sessão da Uber";
    // A Uber contou mais viagens do que o Radar registrou: completa com a média das registradas
    if (s.concl && done.length && s.concl > done.length) {
      const f = s.concl / done.length; extra = { uber:s.concl, radar:done.length };
      pick *= f; wait *= f; ride *= f;

    }

  return { ts, os, done, pick, wait, ride, online, t0, t1, src, s, extra, free: Math.max(0, online - pick - wait - ride) };
}

const TOPF = { tempo:"Tempo total", dist:"Distância total", valor:"Valor da corrida", cat:"Categoria", app:"App" };
const BOTF = { km:"R$/Km", hora:"R$/Hora", min:"R$/Min", nota:"Nota", lucro:"Lucro", lucrohora:"Lucro/Hora" };

const SAMPLE = { tempo:"35 min", dist:"20,5 km", valor:"R$ 76,07", cat:"Black", app:"Uber", km:["R$ 3,71","g"], hora:["R$ 130","g"], min:["R$ 2,17","g"], nota:["4,85","m"], lucro:["R$ 63,77","g"], lucrohora:["R$ 109","g"] };
function mv(arr, i, d){ const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; save(); }
function save(){ pset("card_top", cTop.join(",")); pset("card_bottom", cBot.join(",")); render(); }
function cartao(){
  const colr = c => c==="g"?"var(--good)":c==="r"?"var(--bad)":"var(--mid)";

// Arrastar e soltar (dedo ou mouse): campo → outra posição da mesma linha, bandeja → linha, campo → bandeja
let drag = null;
function startDrag(e){
  if (e.target.closest("button") && !e.target.closest(".tray")) return;
  const el = e.currentTarget, r = el.getBoundingClientRect();
  drag = { el, row: el.dataset.row || null, tray: el.dataset.tray || null, key: el.dataset.key, i: +el.dataset.i, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, ghost: null, moved: false, over: null };
  el.setPointerCapture(e.pointerId);
  el.addEventListener("pointermove", moveDrag); el.addEventListener("pointerup", endDrag); el.addEventListener("pointercancel", endDrag);
}
function moveDrag(e){
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
  if (!drag.moved) { drag.moved = true; const g = drag.el.cloneNode(true); g.classList.add("dghost"); const r = drag.el.getBoundingClientRect();
    g.style.width = r.width + "px"; g.style.height = r.height + "px"; document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("dragging"); }
  drag.ghost.style.left = (e.clientX - drag.dx) + "px"; drag.ghost.style.top = (e.clientY - drag.dy) + "px";
  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest(".slot, .tray");
  if (drag.over && drag.over !== t) drag.over.classList.remove("drag-over");
  drag.over = t; if (t) t.classList.add("drag-over");
}
function endDrag(e){
  if (!drag) return; const d = drag; drag = null;
  d.el.removeEventListener("pointermove", moveDrag); d.el.removeEventListener("pointerup", endDrag); d.el.removeEventListener("pointercancel", endDrag);
  if (d.ghost) d.ghost.remove(); d.el.classList.remove("dragging"); if (d.over) d.over.classList.remove("drag-over");
  const lists = { cTop, cBot }, max = { cTop:3, cBot:4 };
  if (!d.moved) { if (d.tray) { const L = lists[d.tray]; if (L.length < max[d.tray]) { L.push(d.key); save(); } } return; }
  const t = d.over; if (!t) return;
  if (t.classList.contains("tray")) { if (d.row) { lists[d.row].splice(d.i, 1); save(); } return; }
  const row = t.dataset.row, j = +t.dataset.i, L = lists[row];
  if (d.row) { if (d.row !== row) return; L.splice(d.i, 1); L.splice(Math.min(j, L.length), 0, d.key); save(); return; }
  if (d.tray !== row) return;
  if (j < L.length) { if (L.length >= max[row]) L.splice(j, 1, d.key); else L.splice(j, 0, d.key); } else if (L.length < max[row]) L.push(d.key);
  save();
}

function openReplay(id){ try { Radar.replay(id); } catch(e){} }
function countUp(el){ const t = el.textContent.trim(), m = /^(R\$\s)?([\d.]+)(,(\d+))?$/.exec(t); if (!m) return;
  const dec = m[4] ? m[4].length : 0, target = parseFloat(m[2].replace(/\./g,"") + (dec ? "." + m[4] : "")); if (!isFinite(target) || target === 0) return;
  const pre = m[1] || "", t0 = performance.now(), D = 900;
  const fmt = v => pre + v.toLocaleString("pt-BR", { minimumFractionDigits:dec, maximumFractionDigits:dec });
  const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(target * e); if (k < 1) requestAnimationFrame(step); else el.textContent = t; };
  requestAnimationFrame(step); }
function animate(){ if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (!animate.done) { animate.done = true; [...app.children].slice(0, 14).forEach((el, i) => { el.classList.add("anim"); el.style.animationDelay = (i * 55) + "ms"; }); }
  document.querySelectorAll(".bars i, .hourbar i").forEach((el, i) => el.style.animationDelay = (120 + i * 45) + "ms");
  document.querySelectorAll(".track i, .stack i").forEach((el, i) => el.style.animationDelay = (200 + i * 90) + "ms");
  document.querySelectorAll(".kpi b, .offer .val, .hero .big").forEach(countUp); }
function render(){ ({historico, horarios, jornada, custos, cartao, gastos}[page] || historico)(); animate(); }
render();
</script>
