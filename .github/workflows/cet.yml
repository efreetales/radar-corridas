name: Radares CET e DER
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"
permissions:
  contents: write
jobs:
  cet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extrair
        run: |
          mkdir -p out
          python tools/cet_radares.py > out/log.txt 2>&1 || echo "FALHOU" >> out/log.txt
          pip install -q openpyxl
          python tools/der_radares.py >> out/log.txt 2>&1 || echo "DER FALHOU" >> out/log.txt
      - name: Publicar no ramo cet-dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # Se uma das fontes falhar, mantém o arquivo do mês anterior (nunca publica sem a lista da CET)
          git fetch -q origin cet-dados || true
          for f in radares_cet.tsv radares_der.tsv; do
            if [ ! -s "out/$f" ]; then git show "origin/cet-dados:$f" > "out/$f" 2>/dev/null && echo "mantido $f anterior" >> out/log.txt || rm -f "out/$f"; fi
          done
          mv out /tmp/out
          git checkout --orphan cet-dados
          git rm -rf . -q
          cp -r /tmp/out/* .
          git add -A
          git commit -q -m "Dados CET $(date -u +%F)"
          git push -f origin cet-dados
