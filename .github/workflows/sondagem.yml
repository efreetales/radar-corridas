name: Sondagem de fontes
on:
  push:
    branches: [eventos]
    paths: [".github/workflows/sondagem.yml"]
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: eventos }
      - run: python3 tools/mirror_ofm.py | tail -5; find m -type f | wc -l
      - run: |
          cd m && git init -q -b mapas && git add . && git -c user.name=radar-bot -c user.email=radar-bot@users.noreply.github.com commit -qm ofm
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mapas
