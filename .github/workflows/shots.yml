name: Baixar telas da Play Store
on:
  push:
    branches: [referencias]
permissions:
  contents: write
jobs:
  shots:
    if: github.ref == 'refs/heads/referencias'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: referencias }
      - name: Baixar
        run: python3 tools_shots.py
      - name: Publicar
        run: |
          git config user.name radar-bot; git config user.email radar-bot@users.noreply.github.com
          git add -A; git diff --cached --quiet || git commit -m "Telas da Play Store [skip ci]"; git push
