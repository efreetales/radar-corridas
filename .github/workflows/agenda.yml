name: Agenda automática de eventos
on:
  schedule:
    - cron: "7 9 * * *"    # 06:07 em SP
    - cron: "7 19 * * *"   # 16:07 em SP (pega o que entrou durante o dia)
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: agenda, cancel-in-progress: false }
jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: eventos }
      - run: python3 tools/agenda.py
      - run: python3 tools/geocode.py | tee geocode_log.txt
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add eventos.json agenda_log.txt geocode_log.txt
          git diff --cached --quiet || git commit -m "Agenda automática $(TZ=America/Sao_Paulo date +%F)"
          git push
